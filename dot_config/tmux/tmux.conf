##############################################
# /startsteal
# Stolen from
# https://tmux.info/docs/configuration

# ============================================
# ESSENTIAL SETTINGS
# ============================================

# Fix Vim ESC delay
set -sg escape-time 0

# Increase scrollback buffer
set -g history-limit 50000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

# Enable focus events for vim autoread
set -g focus-events on

# Set terminal with proper colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Aggressive resize for multi-client
setw -g aggressive-resize on

# ============================================
# APPEARANCE
# ============================================

# Status bar position
set -g status-position bottom

# kitty is my default terminal, so I'll use it's features when available
if-shell "test -n ${KITTY_PID}" {
    # Status bar colors
    set -g status-style 'bg=#101010 fg=#ffc400'
    set -g status-left-length 20
    set -g status-right-length 50

    # Status bar content
    set -g status-left '#[fg=#ffc400,bold] #S #[fg=#101010]│ '
    set -g status-right '#[fg=#101010]│#[fg=#ffc400] %H:%M #[fg=#101010]|#[fg=#ffc400] %Y-%M-%d '

    # Window status
    setw -g window-status-format ' #I:#W '
    setw -g window-status-current-format '#[fg=#ffc400,bg=#404040,bold] #I:#W '

    # Pane border colors
    set -g pane-border-style 'fg=#101010'
    set -g pane-active-border-style 'fg=#ffc400'

    # Message styling
    set -g message-style 'bg=#404040 fg=#101010 bold'
}

if-shell "test -z ${KITTY_PID}" {
    # Status bar colors
    set -g status-style 'bg=black fg=green'
    set -g status-left-length 20
    set -g status-right-length 50

    # Status bar content
    set -g status-left '#[fg=green] #S #[fg=black]│ '
    set -g status-right '#[fg=black]│#[fg=green] %H:%M #[fg=black]│#[fg=green] %Y-%M-%d '

    # Window status
    setw -g window-status-format ' #I:#W '
    setw -g window-status-current-format '#[fg=black,bg=green] #I:#W '

    # Pane border colors
    set -g pane-border-style 'fg=black'
    set -g pane-active-border-style 'fg=green'

    # Message styling
    set -g message-style 'bg=green fg=black bold'
}

# ============================================
# COPY MODE
# ============================================

# Use vi keys
setw -g mode-keys vi

# /endsteal
##############################################

# SESSIONS
# Session for launching things in "background"
new-session -d -s background

# KEYBINDS
bind e source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
