### Make some windows float

for_window [app_id="com.saivert.pwvucontro"] floating enable
for_window [app_id="org.pipewire.Helvum"] floating enable
for_window [app_id="nm-connection-editor"] floating enable
for_window [app_id="blueman-manager"] floating enable
for_window [app_id="blueman-manager"] resize set width 40 ppt height 60 ppt
for_window [class="Blueman-manager"] floating enable
for_window [class="Blueman-manager"] resize set width 40 ppt height 60 ppt
for_window [app_id="flameshot"] border pixel 0, floating enable, fullscreen disable, move absolute position 0 0
for_window [app_id="galculator"] floating enable
for_window [app_id="nemo" title=".*Properties"] floating enable
for_window [app_id="org.kde.kcharselect"] floating enable, resize set width 50 ppt height 40 ppt, move absolute position 960 30
