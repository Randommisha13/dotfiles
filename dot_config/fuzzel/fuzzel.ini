[main]
font="Mononoki Nerd Font, monospace:size=12"
use-bold=true
icons-enabled=true
terminal=kitty '{cmd}'
lines=20
width=60
horizontal-pad=15
vertical-pad=15
exit-on-keyboard-focus-loss=true

[colors]
background=232323ff
text=aaaaaaff
message=657b83ff
prompt=aaaaaaff
placeholder=93a1a1ff
input=aaaaaaff
match=c76e00ff
selection=aaaaaaff
selection-text=232323ff
selection-match=c76e00ff
counter=93a1a1ff
border=ffc400ff

[border]
width=1
radius=10
selection-radius=10
